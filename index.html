function chart(st) {
  const ms = Object.keys(st.months); const W = 640, H = 240, L = 56, R = 8, T = 10, Bm = 28;
  const max = Math.max(1000, ...ms.map(m => Math.max(st.months[m].in, st.months[m].out)));
  const stp = (x => { const p = Math.pow(10, Math.floor(Math.log10(x))), f = x / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; })(max / 4);
  const top = Math.ceil(max / stp) * stp; const y = v => T + (H - T - Bm) * (1 - v / top); const bw = (W - L - R) / 12; let g = "";
  for (let v = 0; v <= top + 1e-6; v += stp) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${compact(v)}</text>`;
  ms.forEach((m, i) => { const x = L + i * bw, w = Math.max(3, (bw - 10) / 2), d = st.months[m];
    g += `<rect x="${x + 4}" y="${y(d.in)}" width="${w}" height="${y(0) - y(d.in)}" rx="2" fill="var(--in)"><title>${monLabel(m)} in ${money(d.in)}</title></rect>`;
    g += `<rect x="${x + 6 + w}" y="${y(d.out)}" width="${w}" height="${y(0) - y(d.out)}" rx="2" fill="var(--out)"><title>${monLabel(m)} out ${money(d.out)}</title></rect>`;
    g += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${MON[+m.slice(5, 7) - 1]}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Monthly money in and out">${g}</svg>`;
}

  ${d.openDiff ? `<p class="notice" style="margin-top:10px">Opening balances differ by ${money(Math.abs(d.openDiff))}. Check the opening balances of your ledgers (Dr should equal Cr).</p>` : ""}</div></div>`; }
function tbRows(asOf) { const b = balances(asOf); const rows = []; for (const g of groupsAll().values()) { const ls_ = D().ledgers.filter(l => l.group === g.id && (b.get(l.id) || 0)); if (ls_.length) rows.push({g, ls: ls_.map(l => ({l, v: b.get(l.id)}))}); } return rows; }

  const body = rows.map(r => { const gd = r2(r.ls.reduce((a, x) => a + Math.max(0, x.v), 0)), gc = r2(r.ls.reduce((a, x) => a + Math.max(0, -x.v), 0)); dr += gd; cr += gc;
    return `<tr class="sub"><td>${esc(r.g.name)}</td><td class="r num">${gd ? amt(gd) : ""}</td><td class="r num">${gc ? amt(gc) : ""}</td></tr>${r.ls.map(x => `<tr class="click" data-sel-go="${x.l.id}"><td style="padding-left:24px">${esc(x.l.name)}</td><td class="r num">${x.v > 0 ? amt(x.v) : ""}</td><td class="r num">${x.v < 0 ? amt(-x.v) : ""}</td></tr>`).join("")}`; }).join("");
  const diff = r2(dr - cr);

    ${diff ? `<tr><td class="amt-out">Difference in opening balances</td><td class="r num">${diff < 0 ? amt(-diff) : ""}</td><td class="r num">${diff > 0 ? amt(diff) : ""}</td></tr>` : ""}
    <tr class="total"><td>Total</td><td class="r num">${amt(Math.max(dr, cr))}</td><td class="r num">${amt(Math.max(dr, cr))}</td></tr></tbody></table></div></div>`; }
function rpData(y) { const s = fyStart(y) < B() ? B() : fyStart(y), e = fyEnd(y); const ml = moneyLedgers();

async function uploadVoucherReceipt(vid, file) {

    const iv = cur.f.linkInv && vById(cur.f.linkInv); if (iv) { const f2 = JSON.parse(JSON.stringify(iv.f)); const line = (f2.reimb || []).find(x => x.vid === vid); if (line) { line.receipt = rc; upsert("vouchers", {...iv, f: f2}); } }
    upsert("docs", {id: "d-" + uid(), client: c.id, name: rc.name.replace(/\.[a-z0-9]+$/i, ""), url: rc.url, cat: "Govt Fee Receipts", shared: true, driveId: rc.id, at: nowIso()}); commit();
    toast("Receipt saved in " + c.name + " › Shared with Client › Govt Fee Receipts");
  } catch (e) { console.warn(e); toast("Receipt not saved: " + driveErr(e)); } }

  $("#rf-wa").addEventListener("click", () => compose("whatsapp", {client: c.id, kind: "receipt", v})); $("#rf-em").addEventListener("click", () => compose("email", {client: c.id, kind: "receipt", v})); }

async function cleanSignature(file) {
  const url = URL.createObjectURL(file); const im = await loadImg(url); URL.revokeObjectURL(url); if (!im) throw new Error("img");
  const sc = Math.min(1, 900 / im.width); const w = Math.round(im.width * sc), h = Math.round(im.height * sc);
  const c = document.createElement("canvas"); c.width = w; c.height = h; const x = c.getContext("2d"); x.drawImage(im, 0, 0, w, h);
  const d = x.getImageData(0, 0, w, h), p = d.data; let minX = w, minY = h, maxX = 0, maxY = 0;
  for (let i = 0; i < p.length; i += 4) { const lum = 0.3 * p[i] + 0.59 * p[i + 1] + 0.11 * p[i + 2];
    if (lum > 200) p[i + 3] = 0; else { const a = Math.min(255, Math.round((200 - lum) * 2.2)); p[i] = 20; p[i + 1] = 40; p[i + 2] = 90; p[i + 3] = a; const k = i / 4, px = k % w, py = (k - px) / w; if (px < minX) minX = px; if (px > maxX) maxX = px; if (py < minY) minY = py; if (py > maxY) maxY = py; } }
  x.putImageData(d, 0, 0); if (maxX <= minX) throw new Error("blank");
  const pad = 8, tw = maxX - minX + pad * 2, th = maxY - minY + pad * 2; const out = document.createElement("canvas"); const k = Math.min(1, 160 / th); out.width = Math.round(tw * k); out.height = Math.round(th * k);
  out.getContext("2d").drawImage(c, minX - pad, minY - pad, tw, th, 0, 0, out.width, out.height); return out.toDataURL("image/png");
}

// ================= Compliance tracker: statutory due dates, status, reminders =================
const ENTITY = [["company", "Private / Public Limited Company"], ["opc", "One Person Company"], ["llp", "LLP"], ["firm", "Partnership Firm"], ["individual", "Individual / Proprietor"], ["huf", "HUF"], ["trust", "Trust / Society / Section 8"], ["other", "Other"]];
const entityName = k => (ENTITY.find(e => e[0] === k) || [, ""])[1];
const GSTS = [["monthly", "Regular – monthly returns"], ["qrmp", "Regular – QRMP (quarterly)"], ["comp", "Composition"], ["none", "Not registered"]];
// QRMP GSTR-3B: 22nd for these states/UTs, 24th for the rest
const QRMP22 = new Set(["22", "23", "24", "26", "27", "29", "30", "31", "32", "33", "34", "35", "36", "37"]);
const lastDay = (y, m) => new Date(y, m, 0).getDate();
const ymd = (y, m, d) => { while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return y + "-" + pad(m) + "-" + pad(Math.min(d, lastDay(y, m))); };
const nx = (Y, M, d, off = 1) => ymd(Y, M + off, d);
const tdsForm = (old, nw) => x => x.fy >= 2026 ? nw : old;
// f: M monthly, Q quarterly (FY quarters), H half-yearly, Y annual (FY). due(Y, M, x): Y/M = period end year/month, x = {fy, q, h, state}
const COMP = [
  {k: "gstr1", cat: "GST", f: "M", n: "GSTR-1", r: "11th of next month", due: (Y, M) => nx(Y, M, 11)},
  {k: "gstr3b", cat: "GST", f: "M", n: "GSTR-3B", r: "20th of next month", due: (Y, M) => nx(Y, M, 20)},
  {k: "gstr1q", cat: "GST", f: "Q", n: "GSTR-1 (QRMP)", r: "13th after the quarter", due: (Y, M) => nx(Y, M, 13)},
  {k: "iff", cat: "GST", f: "M", n: "IFF (QRMP, optional)", r: "13th of next month · first two months of a quarter", only: M => M % 3 !== 0, due: (Y, M) => nx(Y, M, 13)},
  {k: "pmt06", cat: "GST", f: "M", n: "PMT-06 (QRMP tax payment)", r: "25th of next month · first two months of a quarter", only: M => M % 3 !== 0, due: (Y, M) => nx(Y, M, 25)},
  {k: "gstr3bq", cat: "GST", f: "Q", n: "GSTR-3B (QRMP)", r: "22nd / 24th after the quarter (by state)", due: (Y, M, x) => nx(Y, M, QRMP22.has(x.state || "23") ? 22 : 24)},

  if (f.reimb && x.dr) return "Paid on your behalf" + (v.narration ? " · " + v.narration : ""); return v.narration || "Adjustment"; }
function buildPacket(c) {
  const firm = {}; for (const k of FIRM_KEYS) firm[k] = ST()[k];

}
async function onCreate(e) {
  e.preventDefault(); const pw = $("#c-pw").value, pw2 = $("#c-pw2").value; const err = $("#pw-err");
  if (pw.length < 6) return err.textContent = "Use at least 6 characters."; if (pw !== pw2) return err.textContent = "The two passwords don't match.";
  S.salt = crypto.getRandomValues(new Uint8Array(16)); S.iter = ITER; S.key = await deriveKey(pw, S.salt, ITER); S.pw = pw;
  S.data = newData($("#c-firm").value.trim(), $("#c-start").value, $("#c-cash").value); S.locked = false; S.hasVault = true; S.tab = "settings";
  if (ONLINE) await onlineSave(); else await localSave(); memo = {}; dirty(); toast("Ledger created. Fill in your firm, GSTIN and bank details next.");
}
function lock() { S.locked = true; S.key = null; S.data = null; S.pw = null; S.pk = null; closeModal(); memo = {}; render(); }
function askPassword(title, note, cb, prefill) {
  openModal(`<div class="modal-head"><h2>${esc(title)}</h2><button class="x" data-close aria-label="Close">×</button></div>
    <form id="ap-form" class="stack"><p class="small muted" style="margin:0">${note}</p><input id="ap-pw" type="password" required value="${esc(prefill || "")}"><div class="err" id="ap-err"></div>
    <div class="modal-foot"><span></span><div class="right"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary" type="submit">Continue</button></div></div></form>`);
  $("#ap-form").addEventListener("submit", async ev => { ev.preventDefault(); const b = ev.submitter; b.disabled = true; try { await cb($("#ap-pw").value); } catch (x) { b.disabled = false; $("#ap-err").textContent = x.message === "badpw" ? "Wrong password for this file." : x.message === "notours" ? "This isn't a PNA Ledger file." : "Couldn't open it."; } });
}
function restoreFlow() {
  pickFile(text => askPassword("Open file", "Enter the password that was in use when this file was saved." + (S.data || S.hasVault || (ONLINE && S.online.meta) ? " It replaces what is stored now — use “Merge” in Settings to combine instead." : ""), async pw => {
    const o = await unseal(text, pw); Object.assign(S, {key: o.key, salt: o.salt, iter: o.iter, data: o.data, pw, locked: false, hasVault: true});
    if (ONLINE) await onlineSave(); else await localSave(); closeModal(); memo = {}; dirty(); toast("Ledger opened from file"); }));
}
async function doBackup() { const t = await seal(S.data, S.key, S.salt, S.iter); if (await saveFile("PNA Ledger backup " + todayStr() + ".pnaledger", new Blob([t], {type: "application/octet-stream"}))) { ls.set("lastBackup", todayStr()); logEvent("Encrypted backup downloaded"); dirty(); } }
async function syncOut() { const t = await seal(S.data, S.key, S.salt, S.iter); await saveFile((ONLINE ? "PNA Ledger from online " : "PNA Ledger from MacBook ") + todayStr() + ".pnaledger", new Blob([t], {type: "application/octet-stream"})); }
function syncIn() { pickFile(text => askPassword("Merge file", "Enter the ledger password used for this file.", async pw => { const o = await unseal(text, pw);
  const before = D().vouchers.length; S.data = mergeData(S.data, o.data); memo = {}; persist(); closeModal(); dirty(); toast("Merged · " + (D().vouchers.length - before) + " new vouchers added"); }, S.pw)); }
async function changePassword(e) { e.preventDefault(); const err = $("#p-err"); const o = $("#p-old").value, n = $("#p-new").value, n2 = $("#p-new2").value;
  if (o !== S.pw) return err.textContent = "The current password is wrong."; if (n.length < 6) return err.textContent = "Use at least 6 characters."; if (n !== n2) return err.textContent = "The new passwords don't match.";
  S.salt = crypto.getRandomValues(new Uint8Array(16)); S.key = await deriveKey(n, S.salt, ITER); S.iter = ITER; S.pw = n; ST().updatedAt = nowIso(); persist(); err.textContent = ""; e.target.reset();
  toast(ONLINE ? "Password changed. Use the new password on every device." : "Password changed. The online ledger keeps its own password until you merge this file there."); }
async function linkFile() { try { const h = await window.showSaveFilePicker({suggestedName: "PNA Ledger data.pnaledger", types: [{description: "PNA Ledger data", accept: {"application/octet-stream": [".pnaledger"]}}]});
  S.fileHandle = h; S.fileName = h.name; await Store.set("fileHandle", h); await localSave(); dirty(); toast("Changes will also be saved to " + h.name); } catch (e) { if (e && e.name !== "AbortError") toast("Couldn't use that file."); } }

// ---------- boot ----------
async function boot() {
  if (MODE === "portalweb") { S.portalMode = true; S.locked = true; try { S.portalMeta = JSON.parse($("#pna-site").textContent); } catch { S.portalMeta = {}; }
    const t = (location.hash || "").match(/^#c?([a-z0-9]{8,})$/); S.portalToken = t ? t[1] : ""; render();
    window.addEventListener("hashchange", () => { const t2 = (location.hash || "").match(/^#c?([a-z0-9]{8,})$/); S.portalToken = t2 ? t2[1] : ""; S.locked = true; S.pk = null; S.data = null; closeModal(); render(); }); return; }
  if (MODE === "portalfile") { S.portalMode = true; try { S.portalMeta = {firm: JSON.parse($("#pna-packet").textContent).firm}; } catch {} render(); return; }
  const tok = (location.hash || "").match(/^#c([a-z0-9]{8,})$/); if (ONLINE && tok) { S.portalMode = true; S.portalToken = tok[1]; }
  if (!ONLINE) { if (!cryptoOK()) { S.hasVault = false; render(); return; } S.hasVault = !!(await Store.get("vault"));
    try { const h = await Store.get("fileHandle"); if (h && typeof h === "object" && h.name) { S.fileHandle = h; S.fileName = h.name; } } catch {} render(); return; }
  render(); let tries = 0; while (!(window.claude && window.claude.use) && tries < 30) { await new Promise(r => setTimeout(r, 100)); tries++; }
  const use = n => (window.claude && window.claude.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null));
  const [db, user, dl, mcp] = await Promise.all([use("db"), use("user"), use("downloads"), use("mcp")]);
  Object.assign(S.online, {db, user, dl, mcp, ready: true, uid: user ? await user.id() : null}); render(); if (!db) return;
  if (S.portalMode) { try { const m = await db.doc("portal/" + S.portalToken).get(); S.portalMeta = m.exists ? m.data() : null; } catch { S.portalMeta = null; } render(); return; }
  db.doc("snapshot/meta").onSnapshot(s => { const md = s.exists ? s.data() : null; S.online.meta = md; if (S.locked) { render(); return; } if (md) pullRemote(md); }, () => {});
}

boot();
})();
</script></body></html>
