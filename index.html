*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14.5px;line-height:1.45;margin:0}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:18px 56px}
h1,h2,h3{margin:0;text-wrap:balance} h2{font-size:16px;font-weight:600} h3{font-size:14px}
.muted{color:var(--muted)} .small{font-size:12.5px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
kbd{font-family:inherit;font-size:11px;padding:1px 6px;border-radius:5px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);font-weight:500}
.brandbar{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center;justify-content:space-between;padding-bottom:14px;border-bottom:2px solid var(--accent);position:relative}
.brandbar::after{content:"";position:absolute;left:0;right:0;bottom:-5px;height:1px;background:var(--gold)}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.mono{flex:none;width:46px;height:46px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:17px;letter-spacing:.02em;position:relative}
.mono::after{content:"";position:absolute;left:9px;right:9px;bottom:8px;height:2px;background:var(--gold);border-radius:2px}
.brand .firm{font-family:var(--serif);font-size:21px;font-weight:700;line-height:1.15}
.brand .tag{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:500;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)} .btn.primary:hover{filter:brightness(1.12)}
.btn.primary kbd{background:transparent;color:inherit;border-color:currentColor;opacity:.8}
.btn.danger{color:var(--out);border-color:var(--out)} .btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding-inline:8px}
.btn.sm{padding:5px 10px;font-size:13px} .btn:disabled{opacity:.55;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select.fy{font:inherit;font-weight:600;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:auto}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 40px rgba(0,0,0,.18);padding:6px;min-width:250px}
.menu button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;background:none;color:var(--ink);font:inherit;border-radius:7px;cursor:pointer;text-align:left}
.menu button:hover{background:var(--surface-2)} .menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
nav.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:10px 0 18px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:none;border:0;padding:12px 12px 10px;color:var(--muted);font:inherit;font-weight:500;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button:hover{color:var(--ink)} nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.stack{display:flex;flex-direction:column;gap:16px} .grid{display:grid;gap:16px}
.cols-4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))} .cols-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr))}
.hero-strip{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:18px;align-items:center;background:linear-gradient(120deg,var(--surface) 0%,var(--surface-2) 100%);border:1px solid var(--line);border-radius:14px;padding:18px 20px;position:relative;overflow:hidden}
.hero-strip:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gold)}.hero-strip h2{font-family:"Times New Roman",Georgia,serif;font-size:24px;margin:2px 0 0}.hero-strip .pill{border:0;cursor:pointer;font:inherit;font-size:12px;font-weight:600}
.quote{margin:0;position:relative;padding:4px 64px 4px 18px;border-left:2px solid var(--line)}.quote blockquote{margin:0;font-family:"Times New Roman",Georgia,serif;font-size:17px;line-height:1.45;font-style:italic;color:var(--ink)}.quote figcaption{margin-top:6px;font-size:12.5px;color:var(--gold);font-weight:600;letter-spacing:.02em}
.qnav{position:absolute;right:0;top:50%;transform:translateY(-50%);display:flex;gap:2px}.qnav .x{font-size:20px;width:28px;height:28px}
@media (max-width:860px){.hero-strip{grid-template-columns:minmax(0,1fr)}.quote{padding-left:14px}}
.notes{display:grid;gap:10px}.note{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface)}.note .nhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.note.feed{border-left:3px solid var(--in)}.note .filters a{text-decoration:none}.note h4{margin:8px 0 4px;font-size:15px;line-height:1.35}.note p{margin:0 0 6px;font-size:13.5px;color:var(--muted);line-height:1.5}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.cal .cw{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;padding:2px 0}

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {

        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  // qrcode.stringToBytes

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  <div class="panel"><div class="panel-head"><h2>Invoice-wise (B2B / B2C)</h2></div><div class="tablewrap"><table class="wide"><thead><tr><th>Date</th><th>Invoice</th><th>Client</th><th>GSTIN</th><th>Supply</th><th class="r">Taxable</th><th class="r">Tax</th><th class="r">Total</th></tr></thead><tbody>
    ${rows.map(r => `<tr class="click" data-inv="${r.v.id}"><td class="num">${dmy(r.v.date)}</td><td class="num">${esc(r.v.no)}</td><td>${esc(r.c.name)}</td><td class="num small">${esc(r.c.gstin || "B2C")}</td><td class="small">${({intra: "Intra-state", inter: "Inter-state", export: "Export (LUT)", nogst: "No GST"})[r.v.f.supply]}</td>
      <td class="r num">${amt(r.iv.taxable)}</td><td class="r num">${amt(r.iv.cgst + r.iv.sgst + r.iv.igst)}</td><td class="r num">${amt(r.iv.grand)}</td></tr>`).join("")}</tbody></table></div></div>`; }
function rTDS() { const m = new Map(); vouchers().forEach(v => { if (v.type === "receipt" && +v.f.tds && inFY(v.date, S.fy)) { const o = m.get(v.f.party) || {t: 0, g: 0, n: 0}; o.t += +v.f.tds; o.g += +v.f.amount + +v.f.tds; o.n++; m.set(v.f.party, o); } });
  const rows = [...m].sort((a, b) => b[1].t - a[1].t); const T = rows.reduce((a, [, o]) => a + o.t, 0);
  return `<div class="panel"><div class="panel-head"><h2>TDS deducted by clients · FY ${fyLabel(S.fy)}</h2><span class="small muted">Match with Form 26AS / AIS · ledger balance ${drcr(bal(SYS.tds, fyEnd(S.fy)))}</span></div><table><thead><tr><th>Client</th><th>PAN</th><th class="r">Receipts</th><th class="r">Gross</th><th class="r">TDS</th></tr></thead><tbody>
    ${rows.map(([id, o]) => `<tr><td>${esc(lname(id))}</td><td class="num small">${esc((led(id) || {}).pan || "")}</td><td class="r num">${o.n}</td><td class="r num">${amt(o.g)}</td><td class="r num">${amt(o.t)}</td></tr>`).join("") || `<tr><td colspan="5" class="muted">No TDS recorded this year.</td></tr>`}
    <tr class="total"><td>Total</td><td></td><td></td><td></td><td class="r num">${amt(T)}</td></tr></tbody></table></div>`; }
function rAge() { const list = [...clientDues().values()].filter(s => s.bal).sort((a, b) => b.bal - a.bal); const T = [0, 0, 0, 0]; let tb = 0; list.forEach(s => { tb += s.bal; s.age.forEach((v, i) => T[i] += v); });
  return `<div class="panel"><div class="panel-head"><h2>Client ageing as on ${dmy(todayStr())}</h2><span class="small muted">Receipts set off against the oldest bill first</span></div><div class="tablewrap"><table class="wide"><thead><tr><th>Client</th><th class="r">Due</th><th class="r">0–30</th><th class="r">31–60</th><th class="r">61–90</th><th class="r">Over 90</th></tr></thead><tbody>

    <tr class="total"><td>Total</td><td class="r num">${amt(tb)}</td>${T.map(v => `<td class="r num">${amt(v)}</td>`).join("")}</tr></tbody></table></div></div>`; }

// ================= events =================
function bind() {
  const on = (id, ev, fn) => { const el = document.getElementById(id); if (el) el.addEventListener(ev, fn); };
  on("unlock", "submit", onUnlock); on("create", "submit", onCreate);
  on("fy-sel", "change", e => { S.fy = +e.target.value; S.f.month = "all"; dirty(); });
  on("f-month", "change", e => { S.f.month = e.target.value; dirty(); }); on("f-type", "change", e => { S.f.type = e.target.value; dirty(); });
  on("f-q", "input", e => { S.f.q = e.target.value; dirty(); }); on("l-q", "input", e => { S.lq = e.target.value; dirty(); });
  on("c-q", "input", e => { S.cq = e.target.value; dirty(); }); on("inv-q", "input", e => { S.invQ = e.target.value; dirty(); });
  on("set-form", "submit", saveSettings); bindWeb();
  const cf = S.cf; on("cf-cat", "change", e => { cf.cat = e.target.value; dirty(); }); on("cf-st", "change", e => { cf.st = e.target.value; dirty(); }); on("cf-staff", "change", e => { cf.staff = e.target.value; dirty(); });
  on("cf-q", "input", e => { cf.q = e.target.value; dirty(); }); on("cf-month", "change", e => { cf.month = e.target.value; dirty(); });
  if (S.tab === "comp" && $("main")) bindCompRows($("main")); if (S.tab === "dash") bindEngage($("main")); if (S.tab === "letters") bindLetters(); if (S.tab === "tools") bindTools(); if (S.tab === "settings") bindSafety(); on("pw-form", "submit", changePassword);
  on("dv-auto", "change", e => { ST().driveAuto = e.target.checked; ST().updatedAt = nowIso(); commit(); }); on("dv-subs", "change", e => { ST().driveSubsOn = e.target.checked; ST().updatedAt = nowIso(); commit(); });
  on("au-seal", "change", e => { ST().sealOn = e.target.checked; ST().updatedAt = nowIso(); commit(); }); on("au-qr", "change", e => { ST().qrOn = e.target.checked; ST().updatedAt = nowIso(); commit(); });
  on("au-logo-x", "click", () => { ST().caLogo = ""; ST().caLogoR = 0; ST().updatedAt = nowIso(); commit(); toast("CA logo removed"); });
  on("au-logo", "click", () => { const i = document.createElement("input"); i.type = "file"; i.accept = "image/png,image/jpeg,image/svg+xml,image/webp"; i.onchange = async () => { const f = i.files[0]; if (!f) return; try { const L = await prepLogo(f); ST().caLogo = L.src; ST().caLogoR = L.r; ST().updatedAt = nowIso(); commit(); toast("CA logo saved — it now shows on the letterhead, app header and client portal"); } catch { toast("Couldn't read that image. Try the PNG file."); } }; i.click(); });
  on("au-sign-x", "click", () => { ST().signImg = ""; ST().updatedAt = nowIso(); commit(); toast("Signature removed"); });
  on("au-sign", "click", () => { const i = document.createElement("input"); i.type = "file"; i.accept = "image/png,image/jpeg"; i.onchange = async () => { const f = i.files[0]; if (!f) return; try { ST().signImg = await cleanSignature(f); ST().updatedAt = nowIso(); commit(); toast("Signature saved — it now prints on invoices and statements"); } catch { toast("Couldn't read that image."); } }; i.click(); });
  on("tpl-form", "submit", e => { e.preventDefault(); const t = ST().tpl; ["invoice", "reminder", "receipt", "portal", "comp"].forEach(k => t[k] = $("#tpl-" + k).value); ST().updatedAt = nowIso(); commit(); toast("Templates saved"); });

async function cleanSignature(file) {
  const url = URL.createObjectURL(file); const im = await loadImg(url); URL.revokeObjectURL(url); if (!im) throw new Error("img");
  const sc = Math.min(1, 900 / im.width); const w = Math.round(im.width * sc), h = Math.round(im.height * sc);
  const c = document.createElement("canvas"); c.width = w; c.height = h; const x = c.getContext("2d"); x.drawImage(im, 0, 0, w, h);
  const d = x.getImageData(0, 0, w, h), p = d.data; let minX = w, minY = h, maxX = 0, maxY = 0;
  for (let i = 0; i < p.length; i += 4) { const lum = 0.3 * p[i] + 0.59 * p[i + 1] + 0.11 * p[i + 2];
    if (lum > 200) p[i + 3] = 0; else { const a = Math.min(255, Math.round((200 - lum) * 2.2)); p[i] = 20; p[i + 1] = 40; p[i + 2] = 90; p[i + 3] = a; const k = i / 4, px = k % w, py = (k - px) / w; if (px < minX) minX = px; if (px > maxX) maxX = px; if (py < minY) minY = py; if (py > maxY) maxY = py; } }
  x.putImageData(d, 0, 0); if (maxX <= minX) throw new Error("blank");
  const pad = 8, tw = maxX - minX + pad * 2, th = maxY - minY + pad * 2; const out = document.createElement("canvas"); const k = Math.min(1, 160 / th); out.width = Math.round(tw * k); out.height = Math.round(th * k);
  out.getContext("2d").drawImage(c, minX - pad, minY - pad, tw, th, 0, 0, out.width, out.height); return out.toDataURL("image/png");
}

We refer to our appointment as statutory auditors of {client} ("the Company") under section 139 of the Companies Act, 2013 ("the Act"). As required by Standard on Auditing (SA) 210, "Agreeing the Terms of Audit Engagements", we set out below our understanding of the objective, scope and terms of this engagement for the financial year ending 31 March {fy_end}.

## Objective and scope of the audit
You have requested that we audit the financial statements of the Company, which comprise the Balance Sheet as at 31 March {fy_end}, the Statement of Profit and Loss and the Cash Flow Statement (where applicable) for the year then ended, and notes to the financial statements including a summary of significant accounting policies.

## Our responsibilities
We will conduct the audit in accordance with the Standards on Auditing issued by the Institute of Chartered Accountants of India. Those standards require that we comply with ethical requirements and plan and perform the audit to obtain reasonable assurance. Because of the inherent limitations of an audit, together with the inherent limitations of internal control, there is an unavoidable risk that some material misstatements may not be detected, even though the audit is properly planned and performed.

## Responsibilities of the Board of Directors and management

(a) for the preparation of financial statements that give a true and fair view in accordance with {framework};
(b) for such internal control, including internal financial controls where applicable, as management determines is necessary to enable the preparation of financial statements that are free from material misstatement, whether due to fraud or error; and
(c) to provide us with access to all records, documentation and other matters relevant to the preparation of the financial statements, additional information that we may request for the purpose of the audit, and unrestricted access to persons within the Company from whom we consider it necessary to obtain audit evidence.

As part of our audit process, we will request written representations from management concerning matters relevant to the audit, as required by SA 580.

## Fees

function genPw() { const A = "ABCDEFGHJKMNPQRSTUVWXYZ23456789"; const r = crypto.getRandomValues(new Uint8Array(12)); let s = ""; for (const x of r) s += A[x % A.length]; return s.slice(0, 4) + "-" + s.slice(4, 8) + "-" + s.slice(8); }

// ----- income tax (individual / HUF; normal-rate income). Rates verified 27 Oct 2026; unchanged for FY 2025-26 and FY 2026-27.
const TAX_SRC = [["Income Tax Department – tax slabs", "https://www.incometax.gov.in/iec/foportal/"], ["CBIC – GST notifications 19/2021 & 20/2021 (late fee)", "https://cbic-gst.gov.in/"]];
const NEW_SLABS = [[4e5, 0], [8e5, .05], [12e5, .10], [16e5, .15], [20e5, .20], [24e5, .25], [Infinity, .30]];
const oldSlabs = age => { const ex = age === "80" ? 5e5 : age === "60" ? 3e5 : 2.5e5; return [[ex, 0], [5e5, .05], [1e6, .20], [Infinity, .30]]; };
const slabTax = (ti, slabs) => { let t = 0, prev = 0; for (const [lim, r] of slabs) { if (ti > prev) t += (Math.min(ti, lim) - prev) * r; prev = lim; } return t; };
const SC_BANDS = {old: [[5e7, .37], [2e7, .25], [1e7, .15], [5e6, .10]], new: [[2e7, .25], [1e7, .15], [5e6, .10]]};
function taxBeforeCess(ti, regime, age) { const base = slabTax(ti, regime === "new" ? NEW_SLABS : oldSlabs(age)); let rebate = 0;
  if (regime === "new") { if (ti <= 12e5) rebate = base; else if (base > ti - 12e5) rebate = base - (ti - 12e5); } else if (ti <= 5e5) rebate = Math.min(base, 12500);
  const tax = base - rebate; let sc = 0; const band = SC_BANDS[regime].find(b => ti > b[0]);
  if (band) { sc = tax * band[1]; const atT = taxBeforeCess(band[0], regime, age).total; if (tax + sc > atT + (ti - band[0])) sc = Math.max(0, atT + (ti - band[0]) - tax); }
  return {base, rebate, tax, sc, total: tax + sc}; }
const round10 = x => Math.round(x / 10) * 10;
function incomeTax(inp) { const sal = Math.max(0, +inp.sal || 0), oth = +inp.oth || 0; const out = {};
  for (const regime of ["old", "new"]) { const std = Math.min(sal, regime === "new" ? 75000 : 50000);
    const ded = regime === "old" ? Math.max(0, +inp.ex || 0) + Math.min(150000, Math.max(0, +inp.c80 || 0)) + Math.max(0, +inp.d80 || 0) + Math.min(200000, Math.max(0, +inp.hl || 0)) + Math.max(0, +inp.od || 0) : 0;
    const gross = sal + oth; const ti = Math.max(0, round10(gross - std - ded)); const t = taxBeforeCess(ti, regime, inp.age);
    const cess = t.total * 0.04; out[regime] = {gross, std, ded, ti, ...t, cess, pay: round10(t.total + cess)}; }
  out.better = out.new.pay < out.old.pay ? "new" : out.old.pay < out.new.pay ? "old" : "same"; out.saving = Math.abs(out.new.pay - out.old.pay); return out; }

// ----- advance tax schedule with section 234C interest (estimate)
function advTax(inp) { const fy = +inp.fy || fyOf(todayStr()); const net = Math.max(0, (+inp.liab || 0) - (+inp.tds || 0)); const pres = !!inp.pres;
  const due = [fy + "-06-15", fy + "-09-15", fy + "-12-15", (fy + 1) + "-03-15"]; const pct = pres ? [0, 0, 0, 1] : [.15, .45, .75, 1]; const safe = pres ? [0, 0, 0, 1] : [.12, .36, .75, 1]; const months = [3, 3, 3, 1];
  let cum = 0, int = 0; const rows = due.map((d, i) => { cum += Math.max(0, +(inp["p" + i] || 0)); const req = net * pct[i]; const short = Math.max(0, req - cum);
    const charge = pct[i] && cum < net * safe[i] ? Math.floor(short / 100) * 100 * 0.01 * months[i] : 0; int += charge; return {d, pct: pct[i], req, cum, short, charge, inst: Math.max(0, req - (i ? net * pct[i - 1] : 0))}; });
  return {fy, net, need: net >= 10000, rows, int}; }

    if (ch === '"' && cur === "") { q = true; continue; } if (ch === d) { row.push(cur); cur = ""; continue; }

  if (o !== S.pw) return err.textContent = "The current password is wrong."; if (n.length < 6) return err.textContent = "Use at least 6 characters."; if (n !== n2) return err.textContent = "The new passwords don't match.";
  S.salt = crypto.getRandomValues(new Uint8Array(16)); S.key = await deriveKey(n, S.salt, ITER); S.iter = ITER; S.pw = n; ST().updatedAt = nowIso(); persist(); err.textContent = ""; e.target.reset();

async function linkFile() { try { const h = await window.showSaveFilePicker({suggestedName: "PNA Ledger data.pnaledger", types: [{description: "PNA Ledger data", accept: {"application/octet-stream": [".pnaledger"]}}]});
  S.fileHandle = h; S.fileName = h.name; await Store.set("fileHandle", h); await localSave(); dirty(); toast("Changes will also be saved to " + h.name); } catch (e) { if (e && e.name !== "AbortError") toast("Couldn't use that file."); } }

// ---------- boot ----------
async function boot() {
  if (MODE === "portalweb") { S.portalMode = true; S.locked = true; try { S.portalMeta = JSON.parse($("#pna-site").textContent); } catch { S.portalMeta = {}; }
    const t = (location.hash || "").match(/^#c?([a-z0-9]{8,})(?:\/(.*))?$/); S.portalToken = t ? t[1] : ""; S.portalName = t && t[2] ? decodeURIComponent(t[2]).replace(/-/g, " ").slice(0, 120) : ""; render();
    window.addEventListener("hashchange", () => { const t2 = (location.hash || "").match(/^#c?([a-z0-9]{8,})(?:\/(.*))?$/); S.portalToken = t2 ? t2[1] : ""; S.portalName = t2 && t2[2] ? decodeURIComponent(t2[2]).replace(/-/g, " ").slice(0, 120) : ""; S.locked = true; S.pk = null; S.data = null; closeModal(); render(); }); return; }
  if (MODE === "portalfile") { S.portalMode = true; try { S.portalMeta = {firm: JSON.parse($("#pna-packet").textContent).firm}; } catch {} render(); return; }
  const tok = (location.hash || "").match(/^#c([a-z0-9]{8,})(?:\/(.*))?$/); if (ONLINE && tok) { S.portalMode = true; S.portalToken = tok[1]; S.portalName = tok[2] ? decodeURIComponent(tok[2]).replace(/-/g, " ").slice(0, 120) : ""; }
  if (!ONLINE) { if (!cryptoOK()) { S.hasVault = false; render(); return; } S.hasVault = !!(await Store.get("vault"));
    try { const h = await Store.get("fileHandle"); if (h && typeof h === "object" && h.name) { S.fileHandle = h; S.fileName = h.name; } } catch {} render(); return; }
  render(); let tries = 0; while (!(window.claude && window.claude.use) && tries < 30) { await new Promise(r => setTimeout(r, 100)); tries++; }
  const use = n => (window.claude && window.claude.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null));
  const [db, user, dl, mcp] = await Promise.all([use("db"), use("user"), use("downloads"), use("mcp")]);
  Object.assign(S.online, {db, user, dl, mcp, ready: true, uid: user ? await user.id() : null}); render(); if (!db) return;
  if (S.portalMode) { try { const m = await db.doc("portal/" + S.portalToken).get(); S.portalMeta = m.exists ? m.data() : null; } catch { S.portalMeta = null; } render(); return; }
  db.doc("snapshot/meta").onSnapshot(s => { const md = s.exists ? s.data() : null; S.online.meta = md; if (S.locked) { render(); return; } if (md) pullRemote(md); }, () => {});
}

boot();
})();
